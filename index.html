<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camping Shop - Te Acompañamos en tu Aventura</title>
  <style>
    /* VARIABLES DE DISEÑO (CSS) */
    :root {
      --primary-color: #2e5a44;   /* Verde bosque */
      --secondary-color: #d97724; /* Naranja aventura */
      --dark-color: #1a1a1a;
      --light-color: #f4f6f4;
      --gray-border: #dddddd;
      --white: #ffffff;
      --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* RESET BÁSICO Y BOX-SIZING GLOBAL */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--gray-border);
      color: var(--dark-color);
      line-height: 1.5;
    }

    /* CABECERA Y NAVEGACIÓN STICKY */
    header {
      background-color: var(--primary-color);
      color: var(--white);
      padding: 12px 20px;
      position: fixed;
      width: 100%;
      height: 3px;
      top: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      object-fit:cover;
      gap: 1px;
      text-decoration: none;
      color: #ffffff;
      width: 100%;
    }
    
    .logo {
    left: 0; /* Distancia desde el borde izquierdo */
    width: 35px; /* Ajusta el tamaño de tu logo */
    z-index: 1000; /* Asegura que esté por encima de otros elementos */
    }

    /* SECCIÓN HERO / PORTADA */
    .hero {
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                url('https://hips.hearstapps.com/hmg-prod/images/couple-watching-sunrise-while-camping-royalty-free-image-1591804233.jpg') center/cover no-repeat;
      color: var(--white);
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-style:unset;
    }

    .hero p {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
    }

    /* SECCIÓN DE CATEGORÍAS */
    .categories-section {
      padding: 1rem 1rem;
      background-color: var(--white);
    }

    .section-title {
      text-align: center;
      margin-bottom: 1rem;
      color: var(--primary-color);
      font-size: 1.4rem;
    }

    .category-chips {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scroll-behavior: smooth;
    }

    .category-chip {
      background-color: var(--light-color);
      border: 1px solid var(--gray-border);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-chip.active, .category-chip:hover {
      background-color: var(--primary-color);
      color: var(--white);
      border-color: var(--primary-color);
    }

    /* CATALOGO DE PRODUCTOS */
    .products-section {
      padding: 1rem 1rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    .product-card {
      background-color: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;    
      }

    .product-info {
      padding: 1rem;
    }

    .product-title {
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 0.8rem;
    }

    .btn-view {
      width: 100%;
      background-color: var(--secondary-color);
      color: var(--white);
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* MODAL DE VISTA PERSONALIZADA DE PRODUCTO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: flex-end; /* Aparece desde abajo estilo App móvil */
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      width: 100%;
      max-height: 90vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 1.5rem;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .close-modal {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    .modal-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    /* SELECTORES DE VARIANTES (MODELO Y COLOR) */
    .variant-group {
      margin-bottom: 1.2rem;
    }

    .variant-label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
      font-size: 0.95rem;
    }

    .option-select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      font-size: 1rem;
      background-color: var(--white);
    }

    .color-picker {
      display: flex;
      gap: 0.8rem;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--gray-border);
      cursor: pointer;
      position: relative;
    }

    .color-swatch.selected {
      border: 3px solid var(--primary-color);
      transform: scale(1.1);
    }

    .btn-add-cart {
      width: 100%;
      background-color: var(--primary-color);
      color: var(--white);
      border: none;
      padding: 0.9rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    /* FOOTER */
    footer {
      background-color: var(--dark-color);
      color: var(--white);
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>

  colorSeleccionado = productoSeleccionado.colores[0].nombre;

  productoSeleccionado.colores.forEach((c, index) => {
    const swatch = document.createElement('div');
    swatch.className = `color-swatch ${index === 0 ? 'selected' : ''}`;
    swatch.style.backgroundColor = c.hex;
    swatch.title = c.nombre;
    swatch.onclick = () => seleccionarColor(swatch, c.nombre);
    contenedorColores.appendChild(swatch);
  });

  document.getElementById('modal-producto').classList.add('active');
}
    // FILTRADO POR CATEGORÍAS
    function filtrarCategoria(categoria, elementoBtn) {
      document.querySelectorAll('.category-chip').forEach(btn => btn.classList.remove('active'));
      elementoBtn.classList.add('active');

      if (categoria === 'todas') {
        renderizarProductos(productosDB);
      } else {
        const filtrados = productosDB.filter(p => p.categoria === categoria);
        renderizarProductos(filtrados);
      }
    }

    // ABRIR VISTA PERSONALIZADA (MODAL)
    function abrirModal(id) {
      productoSeleccionado = productosDB.find(p => p.id === id);
      
      document.getElementById('modal-img').src = productoSeleccionado.imagen;
      document.getElementById('modal-titulo').innerText = productoSeleccionado.nombre;
      document.getElementById('modal-precio').innerText = `$${productoSeleccionado.precio.toFixed(2)}`;

      // Cargar opciones de Modelo
      const selectModelo = document.getElementById('select-modelo');
      selectModelo.innerHTML = '';
      productoSeleccionado.modelos.forEach(mod => {
        const opt = document.createElement('option');
        opt.value = mod;
        opt.innerText = mod;
        selectModelo.appendChild(opt);
      });

      // Cargar opciones de Color
      const contenedorColores = document.getElementById('contenedor-colores');
      contenedorColores.innerHTML = '';
      colorSeleccionado = productoSeleccionado.colores[0].nombre;

      productoSeleccionado.colores.forEach((c, index) => {
        const swatch = document.createElement('div');
        swatch.className = `color-swatch ${index === 0 ? 'selected' : ''}`;
        swatch.style.backgroundColor = c.hex;
        swatch.title = c.nombre;
        swatch.onclick = () => seleccionarColor(swatch, c.nombre);
        contenedorColores.appendChild(swatch);
      });

      document.getElementById('modal-producto').classList.add('active');
    }

    function seleccionarColor(elemento, nombreColor) {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      elemento.classList.add('selected');
      colorSeleccionado = nombreColor;
    }

    function cerrarModal() {
      document.getElementById('modal-producto').classList.remove('active');
    }

    function confirmarCompra() {
  // 1. Obtiene el modelo seleccionado en el menú desplegable
  const modelo = document.getElementById('select-modelo').value;
  
  // 2. Define tu número de teléfono de WhatsApp (incluye código de país, sin el símbolo +)
  // Ejemplo para México: 521XXXXXXXXXX | Ejemplo para España: 34XXXXXXXXX
  const telefonoWhatsApp = "5804124869193"; 

  // 3. Crea el mensaje personalizado con los detalles seleccionados por el cliente
  const mensaje = `¡Hola! Me interesa comprar:\n\n` +
                  `*Producto:* ${productoSeleccionado.nombre}\n` +
                  `*Modelo:* ${modelo}\n` +
                  `*Color:* ${colorSeleccionado}\n` +
                  `*Precio:* $${productoSeleccionado.precio.toFixed(2)}\n\n` +
                  `¿Me podrían dar información sobre el pago y envío?`;

  // 4. Codifica el texto para que sea apto para una URL web
  const mensajeCodificado = encodeURIComponent(mensaje);

  // 5. Genera el enlace oficial de WhatsApp
  const urlWhatsApp = `https://wa.me/${telefonoWhatsApp}?text=${mensajeCodificado}`;

  // 6. Redirige al usuario directamente al chat de WhatsApp
  window.open(urlWhatsApp, '_blank');

  // Opcional: Cierra el modal de la vista personalizada
  cerrarModal();
    }

    // INICIALIZACIÓN
    window.onload = () => {
      renderizarProductos(productosDB);
    };
  </script>
